# Improved YOLOv8n-seg
# Architecture per methodology:
#   Backbone : RGC2f blocks + CBAM at blocks 3 & 4 + SPPF
#   Neck     : BiFPN (top-down + bottom-up) with P2/P3/P4/P5
#   Heads    : 4-scale detection + segmentation (32 prototypes)

nc: 4

backbone:
  - [-1, 1, Conv,    [64, 3, 2]]           # 0  208×208
  - [-1, 1, Conv,    [128, 3, 2]]          # 1  104×104
  - [-1, 3, RGC2f,   [128, True]]          # 2  Block 1
  - [-1, 1, Conv,    [256, 3, 2]]          # 3  52×52
  - [-1, 6, RGC2f,   [256, True]]          # 4  Block 2
  - [-1, 1, Conv,    [512, 3, 2]]          # 5  26×26
  - [-1, 6, RGC2f,   [512, True]]          # 6  Block 3
  - [-1, 1, CustomCBAM,    [512]]               # 7  CBAM after block 3
  - [-1, 1, Conv,    [1024, 3, 2]]        # 8  13×13
  - [-1, 3, RGC2f,   [1024, True]]        # 9  Block 4
  - [-1, 1, CustomCBAM,    [1024]]             # 10 CBAM after block 4
  - [-1, 1, SPPF,    [1024, 5]]          # 11 SPPF

head:
  # ── Top-down path ─────────────────────────────────────────────
  - [-1,        1, nn.Upsample, [None, 2, 'nearest']]  # 12
  - [[-1, 7],   1, BiFPN_Add,   [512, 512]]            # 13 P4 fused
  - [-1,        3, RGC2f,       [512]]                 # 14

  - [-1,        1, nn.Upsample, [None, 2, 'nearest']]  # 15
  - [[-1, 4],   1, BiFPN_Add,   [256, 256]]            # 16 P3 fused
  - [-1,        3, RGC2f,       [256]]                 # 17

  - [-1,        1, nn.Upsample, [None, 2, 'nearest']]  # 18
  - [[-1, 2],   1, BiFPN_Add,   [128, 128]]            # 19 P2 fused [NEW]
  - [-1,        3, RGC2f,       [128]]                 # 20 P2 output

  # ── Bottom-up path ────────────────────────────────────────────
  - [-1,        1, Conv,        [128, 3, 2]]           # 21
  - [[-1, 17],  1, BiFPN_Add,   [256, 256]]            # 22 P3 fused
  - [-1,        3, RGC2f,       [256]]                 # 23 P3 output

  - [-1,        1, Conv,        [256, 3, 2]]           # 24
  - [[-1, 14],  1, BiFPN_Add,   [512, 512]]            # 25 P4 fused
  - [-1,        3, RGC2f,       [512]]                 # 26 P4 output

  - [-1,        1, Conv,        [512, 3, 2]]           # 27
  - [[-1, 11],  1, BiFPN_Add,   [1024, 1024]]          # 28 P5 fused
  - [-1,        3, RGC2f,       [1024]]                # 29 P5 output

  # ── Detection + Segmentation heads ───────────────────────────
  - [[20, 23, 26, 29], 1, Segment, [nc, 32, 256]]      # 30